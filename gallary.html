<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <meta name="description" content="Ram Tamang's Gallery — moments from life in Nepal."/>
    <title>Gallery — Ram Tamang</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --blue: #58a6ff;
            --green: #3fb950;
            --text: #e6edf3;
            --text2: #8b949e;
            --muted: #6e7681;
            --border: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* NAV */
        header {
            position: fixed; top: 0; width: 100%;
            z-index: 100;
            background: rgba(13,17,23,0.96);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 0;
        }

        .nav-wrap {
            max-width: 1200px; margin: 0 auto;
            padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        .nav-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem; color: var(--text); text-decoration: none;
        }
        .nav-logo .g { color: var(--green); }

        .nav-links { display: flex; gap: 0.2rem; list-style: none; align-items: center; }
        .nav-links a {
            color: var(--text2); text-decoration: none;
            font-size: 0.87rem; font-weight: 500;
            padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--bg3); }
        .nav-links .btn { color: var(--bg) !important; background: var(--blue); font-weight: 600; }
        .nav-links .btn:hover { background: #79b8ff; }

        .hamburger { display: none; cursor: pointer; color: var(--text); font-size: 1.2rem; }

        /* PAGE HERO */
        .page-hero {
            padding: 7.5rem 0 4rem;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .page-hero .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; color: var(--blue);
            text-transform: uppercase; letter-spacing: 2.5px;
            margin-bottom: 0.6rem;
        }

        .page-hero h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; margin-bottom: 0.75rem; }

        .page-hero p { color: var(--text2); font-size: 1rem; max-width: 500px; margin: 0 auto 1.5rem; }

        /* FILTER TABS */
        .filter-bar {
            display: flex; justify-content: center; gap: 0.5rem;
            padding: 2rem 2rem 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.4rem 1.1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.83rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
        .filter-btn.active { background: var(--blue); border-color: var(--blue); color: var(--bg); }

        /* GALLERY GRID */
        .gallery-wrap {
            max-width: 1400px; margin: 0 auto;
            padding: 2rem 2rem 4rem;
        }

        .gallery-grid {
            columns: 4 280px;
            column-gap: 1rem;
        }

        .g-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .g-item:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.5); }

        .g-item img,
        .g-item video {
            width: 100%;
            display: block;
            transition: filter 0.3s ease;
        }

        .g-item:hover img,
        .g-item:hover video { filter: brightness(0.75); }

        .g-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
            color: #fff; font-size: 1.8rem;
        }
        .g-item:hover .g-overlay { opacity: 1; }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .lightbox.open { display: flex; }

        .lb-inner {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .lb-inner img,
        .lb-inner video {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: block;
        }

        .lb-close {
            position: fixed; top: 1.5rem; right: 1.5rem;
            width: 42px; height: 42px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); font-size: 1.1rem;
            transition: all 0.2s;
        }
        .lb-close:hover { background: var(--bg3); color: var(--blue); }

        .lb-prev, .lb-next {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 46px; height: 46px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); font-size: 1rem;
            transition: all 0.2s;
        }
        .lb-prev { left: 1.5rem; }
        .lb-next { right: 1.5rem; }
        .lb-prev:hover, .lb-next:hover { background: var(--blue); border-color: var(--blue); color: var(--bg); }

        /* FOOTER */
        footer {
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 2rem 0;
        }
        .foot-inner {
            max-width: 1200px; margin: 0 auto; padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem;
        }
        .foot-text { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--muted); }
        .foot-text .g { color: var(--green); }
        .socials { display: flex; gap: 0.5rem; }
        .socials a {
            width: 34px; height: 34px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 7px; display: flex; align-items: center; justify-content: center;
            color: var(--text2); font-size: 0.85rem; text-decoration: none;
            transition: all 0.2s;
        }
        .socials a:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-3px); }

        /* REVEAL */
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.55s ease; }
        .reveal.on { opacity: 1; transform: translateY(0); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .nav-links.open {
                display: flex; flex-direction: column;
                position: absolute; top: 100%; left: 0; right: 0;
                background: rgba(13,17,23,0.98);
                border-bottom: 1px solid var(--border);
                padding: 1rem 2rem; gap: 0.5rem;
            }
            .hamburger { display: block; }
            .gallery-grid { columns: 2 160px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { columns: 1; }
        }
    </style>

<script>
    // Mobile nav
    document.getElementById('hamburger').addEventListener('click', () => {
        document.getElementById('navLinks').classList.toggle('open');
    });

    // Reveal
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); obs.unobserve(e.target); } });
    }, { threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    // Filter
    const items = Array.from(document.querySelectorAll('.g-item'));
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const f = btn.dataset.filter;
            items.forEach(item => {
                item.style.display = (f === 'all' || item.dataset.type === f) ? 'block' : 'none';
            });
        });
    });

    // Lightbox (photos only)
    const photoItems = items.filter(i => i.dataset.type === 'photo');
    let current = 0;
    const lb = document.getElementById('lightbox');
    const lbInner = document.getElementById('lbInner');

    function openLb(idx) {
        current = idx;
        const src = photoItems[idx].querySelector('img').src;
        lbInner.innerHTML = `<img src="${src}" alt="">`;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLb() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
    }

    photoItems.forEach((item, i) => {
        item.addEventListener('click', () => openLb(i));
    });

    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lbPrev').addEventListener('click', () => openLb((current - 1 + photoItems.length) % photoItems.length));
    document.getElementById('lbNext').addEventListener('click', () => openLb((current + 1) % photoItems.length));

    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

    document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') closeLb();
        if (e.key === 'ArrowLeft') openLb((current - 1 + photoItems.length) % photoItems.length);
        if (e.key === 'ArrowRight') openLb((current + 1) % photoItems.length);
    });
</script>
